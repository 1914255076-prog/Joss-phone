function renamePhoto(key){let title='';if(key.startsWith('sample:'))title=samplePhotoNames[Number(key.split(':')[1])]||'';else{const id=key.slice(7),i=(state.sentPhotos||[]).findIndex((x,j)=>String(x.id??j)===id);title=state.sentPhotos[i]?.name||''}const next=prompt('修改照片名称',title);if(next===null||!next.trim())return;if(key.startsWith('sample:')){samplePhotoNames[Number(key.split(':')[1])]=next.trim();saveSamplePhotos()}else{const id=key.slice(7),i=(state.sentPhotos||[]).findIndex((x,j)=>String(x.id??j)===id);if(i>=0)state.sentPhotos[i].name=next.trim();saveState()}showPhotoDetail(key)}
function deletePhoto(key){if(!confirm('确定删除这张照片吗？'))return;if(key.startsWith('sample:')){const i=Number(key.split(':')[1]);samplePhotoNames.splice(i,1);samplePhotoEmoji.splice(i,1);saveSamplePhotos()}else{const id=key.slice(7),i=(state.sentPhotos||[]).findIndex((x,j)=>String(x.id??j)===id);if(i>=0)state.sentPhotos.splice(i,1);saveState()}renderPhotos();showToast('已删除','照片已从模拟相册移除。')}
function replacePhoto(key){const picker=document.createElement('input');picker.type='file';picker.accept='image/*,video/*';picker.onchange=()=>{const f=picker.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{if(key.startsWith('sample:')){const i=Number(key.split(':')[1]);state.sentPhotos=state.sentPhotos||[];state.sentPhotos.unshift({id:'media-'+Date.now(),name:samplePhotoNames[i],type:f.type.startsWith('video/')?'video':'image',data:r.result,added:new Date().toLocaleString('zh-CN')});samplePhotoNames.splice(i,1);samplePhotoEmoji.splice(i,1);saveSamplePhotos()}else{const id=key.slice(7),i=(state.sentPhotos||[]).findIndex((x,j)=>String(x.id??j)===id);if(i>=0){state.sentPhotos[i].data=r.result;state.sentPhotos[i].type=f.type.startsWith('video/')?'video':'image'}}saveState();renderPhotos();showToast('已更新','照片素材已替换。')};r.readAsDataURL(f)};picker.click()}
function handleMediaUpload(files){if(!files||!files.length)return;state.sentPhotos=state.sentPhotos||[];let pending=Array.from(files);let done=0;pending.forEach(file=>{const reader=new FileReader();reader.onload=()=>{state.sentPhotos.unshift({id:'media-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name:file.name,type:file.type.startsWith('video/')?'video':'image',data:reader.result,added:new Date().toLocaleString('zh-CN')});done++;if(done===pending.length){saveState();renderPhotos();showToast('上传完成',`已在相册中显示 ${done} 个媒体文件。`)}};reader.onerror=()=>{done++;if(done===pending.length){saveState();renderPhotos()}};reader.readAsDataURL(file)})}

function showSocialModal(title, placeholder, actionLabel, onSubmitName){
 document.querySelectorAll('.sim-modal-backdrop').forEach(x=>x.remove());
 const wrap=document.createElement('div');wrap.className='sim-modal-backdrop';
 const isIG=onSubmitName==='ig';
 wrap.innerHTML=`<div class="sim-modal" role="dialog" aria-modal="true"><div class="sim-modal-head"><b>${esc(title)}</b><button onclick="this.closest('.sim-modal-backdrop').remove()" aria-label="关闭">✕</button></div><textarea id="simModalText" placeholder="${esc(placeholder)}"></textarea>${isIG?`<label class="ig-upload-picker">＋ 从设备上传帖子照片<input id="igComposeFile" type="file" accept="image/*" hidden></label><div id="igComposePreview" class="ig-compose-preview">选择照片后会在这里预览</div>`:''}<div class="sim-modal-foot"><span>仅保存在本机模拟器</span><button id="simModalSubmit">${esc(actionLabel)}</button></div></div>`;
 $('#w').appendChild(wrap);const ta=$('#simModalText');ta.focus();let imageData='';
 if(isIG){const picker=$('#igComposeFile');picker.onchange=()=>{const file=picker.files&&picker.files[0];if(!file)return;if(!file.type.startsWith('image/')){showToast('文件不支持','请选择图片文件。');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);imageData=canvas.toDataURL('image/jpeg',.78);$('#igComposePreview').innerHTML=`<img src="${imageData}" alt="帖子照片预览">`;};img.onerror=()=>showToast('读取失败','请换一张图片。');img.src=reader.result};reader.readAsDataURL(file)}}
 $('#simModalSubmit').onclick=()=>{const text=ta.value.trim();if(isIG&&!imageData){showToast('还没有照片','请先选择要发布的照片。');return}if(!text&&!imageData){ta.focus();return}wrap.remove();if(onSubmitName==='x')publishSocialPost('x',text);else if(onSubmitName==='threads')publishSocialPost('threads',text);else if(onSubmitName==='ig')publishSocialPost('instagram',text,imageData);else if(onSubmitName==='dm')showToast('私信已发送',text);else showToast(title,text)};
}

<script id="official-store-icon-revision">
/*
 * Official vendor icon artwork revision:
 * Uses artwork returned by Apple's public iTunes Search API for third-party apps.
 * Native iOS system app icons are not substituted because Apple does not publish
 * their current Home Screen artwork as a simple public PNG bundle.
 */
(function () {
  const officialStoreApps = [
    { selector: '.app-icon.app-line', term: 'LINE', bundle: 'jp.naver.line.android' },
    { selector: '.app-icon.app-social', term: 'Instagram', bundle: 'com.burbn.instagram' },
    { selector: '.app-icon.app-threads', term: 'Threads', bundle: 'com.instagram.barcelona' },
    { selector: '.app-icon.app-xapp', term: 'X', bundle: 'com.atebits.Tweetie2' },
    { selector: '.app-icon.app-youtube', term: 'YouTube', bundle: 'com.google.ios.youtube' }
  ];
  const resolved = new Set();
  function getAppButton(selector) {
    return Array.from(document.querySelectorAll(selector)).find(el => el.querySelector('.glyph'));
  }
  function replaceIcon(button, artwork) {
    const glyph = button && button.querySelector('.glyph');
    if (!glyph || !artwork) return;
    let img = glyph.querySelector('img.official-store-icon');
    if (!img) {
      img = document.createElement('img');
      img.className = 'official-store-icon';
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;';
      glyph.replaceChildren(img);
    }
    img.src = artwork;
  }
  async function loadOfficialArtwork(app) {
    try {
      const response = await fetch('https://itunes.apple.com/search?term=' + encodeURIComponent(app.term) + '&entity=software&limit=15&country=us');
      if (!response.ok) return;
      const data = await response.json();
      const results = data.results || [];
      const exact = results.find(item => (item.bundleId || '').toLowerCase() === app.bundle.toLowerCase())
        || results.find(item => (item.trackName || '').toLowerCase() === app.term.toLowerCase());
      if (!exact) return;
      const artwork = exact.artworkUrl512 || exact.artworkUrl100 || exact.artworkUrl60;
      if (!artwork) return;
      const update = () => {
        const button = getAppButton(app.selector);
        if (button) replaceIcon(button, artwork);
      };
      update();
      const observer = new MutationObserver(update);
      observer.observe(document.body, { childList: true, subtree: true });
    } catch (_) {
      /* Offline / blocked network: preserve existing icon rather than break the simulator. */
    }
  }
  function start() {
    officialStoreApps.forEach(app => {
      if (resolved.has(app.selector)) return;
      resolved.add(app.selector);
      loadOfficialArtwork(app);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
  else start();
})();
</script>
