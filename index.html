 document.querySelectorAll('.sim-modal-backdrop').forEach(x=>x.remove());

 const isIG=onSubmitName==='ig';

 $('#w').appendChild(wrap);const ta=$('#simModalText');ta.focus();let imageData='';
 if(isIG){const picker=$('#igComposeFile');picker.onchange=()=>{const file=picker.files&&picker.files[0];if(!file)return;if(!file.type.startsWith('image/')){showToast('文件不支持','请选择图片文件。');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);imageData=canvas.toDataURL('image/jpeg',.78);$('#igComposePreview').innerHTML=`<img src="${imageData}" alt="帖子照片预览">`;};img.onerror=()=>showToast('读取失败','请换一张图片。');img.src=reader.result};reader.readAsDataURL(file)}}
 $('#simModalSubmit').onclick=()=>{const text=ta.value.trim();if(isIG&&!imageData){showToast('还没有照片','请先选择要发布的照片。');return}if(!text&&!imageData){ta.focus();return}wrap.remove();if(onSubmitName==='x')publishSocialPost('x',text);else if(onSubmitName==='threads')publishSocialPost('threads',text);else if(onSubmitName==='ig')publishSocialPost('instagram',text,imageData);else if(onSubmitName==='dm')showToast('私信已发送',text);else showToast(title,text)};
}
