function translateMessage(text,chatName){if(zhTranslations[text])return zhTranslations[text];if(/^中文$/.test(text))return '';if(/^[\u0E00-\u0E7F\s\p{P}\p{S}]+$/u.test(text))return '（泰语原文：'+text+'）';if(/^(📷|🎨|😂|💛|🐻|🏀|🍜|🎬|🚐)/u.test(text))return '（表情／媒体消息）';if(chatName==='Guinzly 🐻'||chatName==='Gawin Caskey'||chatName==='Kevin Liu'||chatName==='Fai'||chatName==='Bella'||chatName==='JGG 🧸')return '（中文翻译：'+({ 'Okay, J.':'好，J。','I’ll tell Bella. Thanks!':'我会告诉 Bella，谢谢！','She’s going to be so excited.':'她一定会很兴奋。','Please bring snacks 😂':'记得带零食😂','Yayyyyy!! 💛':'耶耶耶！！💛','I’ll tell Guinzly!':'我会告诉 Guinzly！','Promise?':'说好了？','Dinner after work?':'下班后吃饭吗？','If I survive today’s schedule.':'如果我能活着熬过今天的行程。','You coming to the gym tomorrow?':'你明天来健身房吗？','So no. Got it.':'所以不来。懂了。'}[text]||'这句话表达了日常聊天中的回应。')+'）';return '（中文翻译：'+text+'）'}

function renderChat(name,scrollBottom=false){activeApp='chat';activeChat=name;const c=state.chats[name];const messages=c.messages.map((m,mi)=>{if(m[0]==='中文')return '';const text=String(m[1]??'');const next=c.messages[mi+1];const translation=next&&next[0]==='中文'?next[1]:translateMessage(text,name);const isMedia=/^(data:image|data:video)/.test(text);const bubbleContent=isMedia?`<${text.startsWith('data:video')?'video':'img'} class="bubble-media" src="${text}" ${text.startsWith('data:video')?'controls':''}></${text.startsWith('data:video')?'video':'img'}>`:esc(text);return `<div class="bubble-row ${m[0]==='J'?'me':'them'}"><div class="bubble-stack"><div class="bubble">${bubbleContent}</div><div class="bubble-translation">${esc(translation)}</div></div><span class="bubble-time">${esc(m[2]||'')}</span></div>`}).join('');setScreen(`<div class="screen-root app-screen"><div class="chat-view">${header(name,'line',`<button class="head-action" onclick="showToast('Voice call','Calls are simulated in this prototype.')">☎</button>`).replace('class="app-header"','class="app-header"')}<div class="chat-log" id="chatLog"><div class="date-divider">Monday, May 18, 2026</div>${messages}</div><div class="chat-composer"><button class="attach" onclick="showAttachmentMenu()">＋</button><input id="messageInput" placeholder="Message" autocomplete="off" onkeydown="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">↑</button></div></div></div>`);if(scrollBottom){const log=$('#chatLog');if(log)log.scrollTop=log.scrollHeight}}
function showAttachmentMenu(){const picker=document.createElement('input');picker.type='file';picker.accept='image/*,video/*';picker.multiple=true;picker.onchange=()=>{if(!picker.files||!activeChat)return;const target=activeChat;Array.from(picker.files).forEach(file=>{const r=new FileReader();r.onload=()=>{state.chats[target].messages.push(['J',r.result,clockNow()]);state.sentPhotos=state.sentPhotos||[];state.sentPhotos.unshift({name:file.name,type:file.type.startsWith('video/')?'video':'image',data:r.result,added:new Date().toLocaleString('zh-CN')});saveState();if(activeApp==='chat'&&activeChat===target)renderChat(target,true)};r.readAsDataURL(file)})};picker.click()}
function sendMessage(){const input=$('#messageInput');if(!input||!input.value.trim()||!activeChat)return;const target=activeChat,text=input.value.trim(),c=state.chats[target];c.messages.push(['J',text,clockNow()]);input.value='';saveState();renderChat(target,true);const reply=makeReply(target,text);setTimeout(()=>{const cc=state.chats[target];cc.messages.push([target==='Guinzly 🐻'?'G':target==='Gawin Caskey'?'G':target==='Kevin Liu'?'K':target==='P’Palm'?'P':target==='P’Tha'?'T':target[0],reply,clockNow()]);if(activeApp==='chat'&&activeChat===target){saveState();renderChat(target,true)}else{cc.unread=(cc.unread||0)+1;saveState();showToast(target,reply)}},700+Math.random()*500)}
function clockNow(){return new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
function makeReply(name,text){const t=text.toLowerCase();if(name==='Guinzly 🐻'){if(/snack|food|eat|croissant/.test(t))return ['Pops, you understand me 😌','I was only asking!','Can Dada have one too?'][Math.floor(Math.random()*3)];if(/dada|gawin/.test(t))return ['Dada will be happy to hear that.','I’ll tell Dada when he gets home!','You two are so obvious 😂'][Math.floor(Math.random()*3)];if(/love|miss/.test(t))return ['Love you too, Pops 💛','I miss you when you’re busy.','Awww. Can I have a hug?'][Math.floor(Math.random()*3)];return ['Okay, Pops! 🐻','Wait, I have one more thing to tell you.','Hehe. Don’t forget my snack!'][Math.floor(Math.random()*3)]}if(name==='Gawin Caskey'){if(/miss|love/.test(t))return ['J… you can’t just say that out of nowhere.','I know. I miss you too.','You’re being weird today 😂'][Math.floor(Math.random()*3)];if(/photo|picture|pic/.test(t))return ['Send it to me.','Why do you have so many photos of me?','That one is actually nice.'][Math.floor(Math.random()*3)];return ['Okay, J.','You’re impossible, P’Joss.','I’ll let you know when I’m free.'][Math.floor(Math.random()*3)]}if(name==='Kevin Liu')return ['😂 I’m saving this for the group chat.','You know I’m right.','Anyway, dinner later?'][Math.floor(Math.random()*3)];if(name==='Fai')return ['I’ll tell Bella. Thanks!','She’s going to be so excited.','Please bring snacks 😂'][Math.floor(Math.random()*3)];if(name==='Bella')return ['Yayyyyy!! 💛','I’ll tell Guinzly!','Promise?'][Math.floor(Math.random()*3)];if(name==='P’Palm')return ['Noted. I’ll send the schedule shortly.','You’re welcome. Please be on time tomorrow.'][Math.floor(Math.random()*2)];if(name==='P’Tha')return ['Thank you. Have a good evening.','See you tomorrow.'][Math.floor(Math.random()*2)];return ['Haha, okay.','Got it. Talk later!','😂😂'][Math.floor(Math.random()*3)]}
function renderPhotos(){activeApp='photos';const labels=['GMMTV café','Basketball day','Guinzly’s drawing','Coffee with G','Backstage','Dinner','A blurry selfie','Golden hour','Saved photo','Dada & Guinzly','Work day','Snacks'];const sample=['☕','🏀','🎨','🥤','🎬','🍜','🤳','🌇','📸','🐻','🎥','🍪'];setScreen(`<div class="screen-root app-screen">${header('อัลบั้มภาพถ่าย','home','<span class="head-action">选择</span>')}<div class="photo-toolbar"><div><strong>最近项目</strong><div class="small-caption">${labels.length+(state.sentPhotos||[]).length} 个项目 · 本机相册</div></div><label class="photo-upload">＋ 上传照片／视频<input id="mediaUpload" type="file" accept="image/*,video/*" multiple hidden onchange="handleMediaUpload(this.files)"></label></div><div class="app-body"><div class="photo-grid">${labels.map((x,i)=>`<div class="photo-tile" onclick="showToast('照片详情','${esc(x)}')"><div style="height:100%;display:grid;place-items:center;font-size:38px;background:linear-gradient(140deg,#a9b9ce,#e4b8c0,#697f99)">${sample[i]}</div><span class="tile-caption">${x}</span></div>`).join('')}${(state.sentPhotos||[]).map((x,i)=>`<div class="photo-tile">${x.type==='video'?`<video src="${x.data}" muted playsinline></video>`:`<img src="${x.data}" alt="上传的照片">`}<span class="tile-caption">${esc(x.name||'上传的媒体')}</span></div>`).join('')}</div></div></div>`)}
function handleMediaUpload(files){if(!files||!files.length)return;state.sentPhotos=state.sentPhotos||[];let pending=Array.from(files);let done=0;pending.forEach(file=>{const reader=new FileReader();reader.onload=()=>{state.sentPhotos.unshift({name:file.name,type:file.type.startsWith('video/')?'video':'image',data:reader.result,added:new Date().toLocaleString('zh-CN')});done++;if(done===pending.length){saveState();renderPhotos();showToast('上传完成',`已在相册中显示 ${done} 个媒体文件。`)}};reader.onerror=()=>{done++;if(done===pending.length){saveState();renderPhotos()}};reader.readAsDataURL(file)})}

function renderCalls(){activeApp='calls';setScreen(`<div class="screen-root app-screen">${header('Recents','home')}<div class="app-body">${state.calls.map(c=>`<div class="call-row"><div class="call-icon" style="background:${/未接|无人接听/.test(c[1])?'#fff0ef':/取消|拒接/.test(c[1])?'#f1f1f4':'#e5f8eb'};color:${/未接|无人接听|拒接/.test(c[1])?'#d94b45':'#21a95c'}">${/未接/.test(c[1])?'↙':/呼出/.test(c[1])?'↗':'☎'}</div><div style="flex:1"><strong>${esc(c[0])}</strong><div class="small-caption">${esc(c[1])}</div></div><span class="small-caption">${esc(c[2])}</span><button class="head-action" style="border:0;background:transparent;color:#3680e8" onclick="showToast('Call', 'Calls are simulated in this prototype.')">ⓘ</button></div>`).join('')}</div></div>`)}
function renderSocial(){activeApp='social';setScreen(`<div class="screen-root app-screen">${header('Instagram','home')}<div class="app-body pad"><div style="font-size:22px;font-weight:800;margin:2px 0 14px">Instagram</div><div style="display:flex;gap:13px;overflow:auto;padding-bottom:16px">${[['Joss','🌟'],['Gawin','🧢'],['Guinzly','🐻'],['Kevin','📸'],['Fai','💗']].map(x=>`<div style="text-align:center;min-width:58px"><div class="avatar" style="margin:auto;background:linear-gradient(135deg,#d5a4bc,#7d8cb5)">${x[1]}</div><small>${x[0]}</small></div>`).join('')}</div><div class="social-post"><div class="post-head"><div class="avatar small">J</div><strong>josswayar</strong><span style="margin-left:auto">•••</span></div><div class="social-image">☕　📷</div><p><strong>josswayar</strong> A quiet coffee before a very long day. ☕<br><span class="small-caption">Liked by kevinliu and others · 2 hours ago</span></p></div><div class="social-post"><div class="post-head"><div class="avatar small" style="background:linear-gradient(135deg,#7d9eb8,#555e85)">G</div><strong>gawincaskey</strong><span style="margin-left:auto">•••</span></div><div class="social-image" style="background:linear-gradient(145deg,#a7b7c4,#64778e,#d8c0b5)">🧢　🌆</div><p><strong>gawincaskey</strong> Someone keeps stealing my cap.<br><span class="small-caption">Liked by josswayar and others · 4 hours ago</span></p></div></div></div>`)}
function renderNotes(){activeApp='notes';setScreen(`<div class="screen-root app-screen">${header('Notes','home','<button class="head-action" onclick="addNote()">＋ New</button>')}<div class="app-body pad">${state.notes.map((n,i)=>`<div class="note-card" onclick="editNote(${i})"><strong>${esc(n.title)}</strong><p style="white-space:pre-wrap;font-size:12px;color:#747987;margin-top:7px;line-height:1.5">${esc(n.body)}</p><div class="small-caption" style="margin-top:10px">On My iPhone</div></div>`).join('')}</div></div>`)}
function addNote(){const title=prompt('Note title','New note');if(title===null)return;const body=prompt('Note text','');if(body===null)return;state.notes.unshift({title,body});saveState();renderNotes()}
function editNote(i){const n=state.notes[i];const body=prompt(n.title,n.body);if(body===null)return;n.body=body;saveState();renderNotes()}
function renderSMS(){activeApp='sms';setScreen(`<div class="screen-root app-screen">${header('Messages','home')}<div class="app-body">${state.sms.map(m=>`<div class="chat-row" onclick="showToast('${esc(m[0])}','${esc(m[1])}')"><div class="avatar" style="background:linear-gradient(135deg,#70c8f4,#387ad8)">✉</div><div class="chat-meta"><strong>${esc(m[0])}</strong><p>${esc(m[1])}</p></div><div class="chat-side">${esc(m[2])}</div></div>`).join('')}</div></div>`)}
function renderContacts(){activeApp='contacts';const names=Object.keys(state.chats);setScreen(`<div class="screen-root app-screen">${header('Contacts','home')}<div class="app-body">${names.map(n=>{const c=state.chats[n];return `<div class="contact-row" onclick="showToast('${esc(n)}','Contact card · Fictional simulator')"><div class="avatar" style="background:${c.color}">${esc(c.initials)}</div><div><strong>${esc(n)}</strong><div class="small-caption">Mobile · Saved contact</div></div></div>`}).join('')}</div></div>`)}
function renderCalendar(){activeApp='calendar';setScreen(`<div class="screen-root app-screen">${header('Calendar','home')}<div class="app-body pad"><div style="font-size:22px;font-weight:800">May 2026</div><p class="small-caption" style="margin:5px 0 18px">Monday, May 18</p>${state.calendar.map(e=>`<div class="note-card" style="display:flex;gap:12px;align-items:center"><div style="width:44px;text-align:center;border-right:2px solid #e45b5b;padding-right:10px"><div style="font-size:20px;font-weight:800">${e[0]}</div><div class="small-caption">MAY</div></div><div><strong>${esc(e[1])}</strong><p class="small-caption" style="margin-top:4px">${esc(e[2])}</p></div></div>`).join('')}</div></div>`)}
function renderFiles(){activeApp='files';setScreen(`<div class="screen-root app-screen">${header('Files','home')}<div class="app-body pad"><div class="note-card">📁 <strong>On My iPhone</strong><p class="small-caption" style="margin-top:8px">Documents · Downloads · Work</p></div><div class="note-card">📄 <strong>Tomorrow’s call sheet.pdf</strong><p class="small-caption">Modified yesterday</p></div><div class="note-card">🖼️ <strong>Guinzly drawing.jpg</strong><p class="small-caption">Shared by Fai</p></div></div></div>`)}
function renderSettings(){activeApp='settings';setScreen(`<div class="screen-root app-screen">${header('Settings','home')}<div class="app-body"><div class="contact-row"><div class="avatar" style="background:linear-gradient(135deg,#8ca4d2,#4c5a84)">J</div><div><strong>Joss Way-ar</strong><div class="small-caption">Apple Account · Fictional device</div></div></div><div class="subheading" style="padding:0 15px">General</div>${[['🔋','Battery','69%'],['📶','Wi-Fi','Connected'],['🔔','Notifications','On'],['🔒','Privacy & Security','Protected']].map(x=>`<div class="setting-row"><span style="font-size:21px">${x[0]}</span><span>${x[1]}</span><span class="small-caption" style="margin-left:auto">${x[2]}</span></div>`).join('')}<div class="subheading" style="padding:0 15px">Simulator</div><div class="setting-row"><span>Reset local simulator data</span><button onclick="resetSimulator()">Reset</button></div><div style="padding:14px 16px;font-size:11px;color:#8a8f9d;line-height:1.5">Messages and notes are saved only in this browser on this device. Replies are scripted, not generated by a live AI service.</div></div></div>`)}
function renderSimple(title,emoji,description){activeApp='simple';setScreen(`<div class="screen-root app-screen">${header(title,'home')}<div class="app-body empty-state"><div style="font-size:50px">${emoji}</div><p style="margin-top:12px">${description}</p></div></div>`)}
function showToast(title,message){document.querySelectorAll('.toast').forEach(e=>e.remove());const el=document.createElement('div');el.className='toast';el.innerHTML=`<strong>${esc(title)}</strong><p>${esc(message)}</p>`;$('#w').appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2800)}
function resetSimulator(){if(confirm('Reset all simulator messages and notes on this browser?')){localStorage.removeItem(STORE_KEY);state=structuredCloneSafe(defaultState);renderSettings();showToast('Reset complete','The original fictional messages have been restored.')}}
$('#hb').addEventListener('click',goHome);
renderLock();
</script>
</body></html>
